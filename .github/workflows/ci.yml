name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2
      - run: rustup component add clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make test
      - run: make images
      - name: Check committed generated artifacts
        run: git diff --exit-code -- chalks/plugin/chalks_engine.wasm chalks/images
      - name: typst-package-check
        run: docker run --rm -v "$PWD/chalks:/data" ghcr.io/typst/package-check check
